[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-mcp"
version = "0.1.0"
description = "MCP server for controlling Android devices over the network (wireless ADB)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruslan Strogov", email = "ruslan@strogov.com" }]
keywords = ["mcp", "android", "adb", "automation", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
android-mcp = "android_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/RuslanStrogov/android-mcp"
Repository = "https://github.com/RuslanStrogov/android-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/android_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
